<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Two engineers reviewing project plans">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f1"/><stop offset="1" stop-color="#dbe6e1"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgT)"/>
  <!-- plan board -->
  <rect x="250" y="70" width="300" height="210" rx="8" fill="#24433f"/>
  <g stroke="#3f6f65" stroke-width="2"><line x1="250" y1="120" x2="550" y2="120"/><line x1="250" y1="170" x2="550" y2="170"/><line x1="250" y1="220" x2="550" y2="220"/><line x1="320" y1="70" x2="320" y2="280"/><line x1="400" y1="70" x2="400" y2="280"/><line x1="480" y1="70" x2="480" y2="280"/></g>
  <g stroke="#c9a24b" stroke-width="4" fill="none"><rect x="300" y="110" width="120" height="110"/><line x1="300" y1="160" x2="360" y2="160"/><line x1="360" y1="110" x2="360" y2="220"/><rect x="450" y="130" width="60" height="60"/></g>
  <!-- table -->
  <rect x="150" y="470" width="500" height="24" rx="6" fill="#2f574f"/>
  <!-- engineer left -->
  <g>
    <path d="M250 470 v-70 a55 55 0 0 1 110 0 v70 Z" fill="#24433f"/>
    <circle cx="305" cy="360" r="40" fill="#e9d3ad"/>
    <path d="M263 356 a42 34 0 0 1 84 0 h-84 Z" fill="#c9a24b"/>
    <rect x="263" y="350" width="84" height="12" rx="6" fill="#a9812f"/>
  </g>
  <!-- engineer right -->
  <g>
    <path d="M470 470 v-64 a52 52 0 0 1 104 0 v64 Z" fill="#2f574f"/>
    <circle cx="522" cy="372" r="38" fill="#d8b58a"/>
    <path d="M482 368 a40 32 0 0 1 80 0 h-80 Z" fill="#c9a24b"/>
    <rect x="482" y="362" width="80" height="12" rx="6" fill="#a9812f"/>
  </g>
  <!-- hi-vis stripes -->
  <g fill="#e4c578"><rect x="288" y="430" width="34" height="8"/><rect x="505" y="435" width="34" height="8"/></g>
  <rect x="0" y="560" width="800" height="40" fill="#24433f"/>
  <rect x="0" y="560" width="800" height="6" fill="#c9a24b" opacity="0.6"/>
</svg>
