<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Completed modern buildings at golden hour">
  <defs>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f574f"/><stop offset="1" stop-color="#1a322e"/></linearGradient>
    <linearGradient id="towerA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35625a"/><stop offset="1" stop-color="#24433f"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyA)"/>
  <circle cx="600" cy="170" r="90" fill="#c9a24b" opacity="0.9"/>
  <circle cx="600" cy="170" r="120" fill="#e4c578" opacity="0.18"/>
  <!-- skyline back -->
  <g fill="#24433f" opacity="0.85">
    <rect x="40" y="330" width="90" height="270"/><rect x="140" y="290" width="70" height="310"/><rect x="650" y="300" width="110" height="300"/>
  </g>
  <!-- brand-echo stepped tower -->
  <g fill="url(#towerA)">
    <rect x="330" y="120" width="46" height="480"/><rect x="376" y="170" width="46" height="430"/>
    <rect x="284" y="210" width="46" height="390"/><rect x="422" y="240" width="46" height="360"/>
    <rect x="240" y="290" width="44" height="310"/><rect x="468" y="300" width="44" height="300"/>
  </g>
  <!-- lit windows -->
  <g fill="#e4c578" opacity="0.9">
    <rect x="342" y="160" width="10" height="16"/><rect x="360" y="160" width="10" height="16"/><rect x="342" y="220" width="10" height="16"/><rect x="360" y="280" width="10" height="16"/>
    <rect x="388" y="210" width="10" height="16"/><rect x="404" y="270" width="10" height="16"/><rect x="388" y="330" width="10" height="16"/>
    <rect x="296" y="250" width="10" height="16"/><rect x="312" y="320" width="10" height="16"/><rect x="434" y="290" width="10" height="16"/><rect x="450" y="360" width="10" height="16"/>
  </g>
  <!-- ground -->
  <rect x="0" y="560" width="800" height="40" fill="#142822"/>
  <rect x="0" y="560" width="800" height="6" fill="#c9a24b" opacity="0.6"/>
</svg>
