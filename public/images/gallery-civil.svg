<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Civil and structural works: foundations, columns and reinforcement">
  <defs>
    <linearGradient id="skyV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f1"/><stop offset="1" stop-color="#dbe6e1"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyV)"/>
  <circle cx="120" cy="110" r="48" fill="#e4c578" opacity="0.8"/>
  <!-- ground layers -->
  <rect x="0" y="360" width="800" height="240" fill="#2f574f"/>
  <rect x="0" y="420" width="800" height="180" fill="#24433f"/>
  <rect x="0" y="490" width="800" height="110" fill="#1a322e"/>
  <!-- concrete slab -->
  <rect x="60" y="330" width="680" height="40" fill="#c3d3cd"/>
  <!-- columns rising with rebar -->
  <g>
    <rect x="170" y="180" width="70" height="190" fill="#8fb3a8"/>
    <rect x="380" y="150" width="70" height="220" fill="#8fb3a8"/>
    <rect x="590" y="200" width="70" height="170" fill="#8fb3a8"/>
  </g>
  <!-- rebar cages (gold) -->
  <g stroke="#c9a24b" stroke-width="4" fill="none">
    <line x1="185" y1="120" x2="185" y2="200"/><line x1="205" y1="120" x2="205" y2="200"/><line x1="225" y1="120" x2="225" y2="200"/>
    <line x1="180" y1="140" x2="230" y2="140"/><line x1="180" y1="165" x2="230" y2="165"/><line x1="180" y1="190" x2="230" y2="190"/>
    <line x1="395" y1="90" x2="395" y2="170"/><line x1="415" y1="90" x2="415" y2="170"/><line x1="435" y1="90" x2="435" y2="170"/>
    <line x1="390" y1="110" x2="440" y2="110"/><line x1="390" y1="135" x2="440" y2="135"/><line x1="390" y1="160" x2="440" y2="160"/>
    <line x1="605" y1="140" x2="605" y2="220"/><line x1="625" y1="140" x2="625" y2="220"/><line x1="645" y1="140" x2="645" y2="220"/>
    <line x1="600" y1="160" x2="650" y2="160"/><line x1="600" y1="185" x2="650" y2="185"/><line x1="600" y1="210" x2="650" y2="210"/>
  </g>
  <rect x="0" y="330" width="800" height="6" fill="#c9a24b" opacity="0.5"/>
