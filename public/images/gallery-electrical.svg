<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Electrical distribution panel with breakers and power conduits">
  <defs>
    <linearGradient id="skyE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f1"/><stop offset="1" stop-color="#dbe6e1"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyE)"/>
  <!-- distribution panel -->
  <rect x="120" y="120" width="300" height="360" rx="10" fill="#2f574f"/>
  <rect x="140" y="140" width="260" height="320" rx="6" fill="#1a322e"/>
  <!-- main switch -->
  <rect x="165" y="165" width="210" height="42" rx="4" fill="#24433f"/>
  <rect x="330" y="172" width="30" height="28" rx="3" fill="#c9a24b"/>
  <!-- breaker rows -->
  <g fill="#3f6f65">
    <rect x="165" y="230" width="90" height="30" rx="3"/><rect x="285" y="230" width="90" height="30" rx="3"/>
    <rect x="165" y="275" width="90" height="30" rx="3"/><rect x="285" y="275" width="90" height="30" rx="3"/>
    <rect x="165" y="320" width="90" height="30" rx="3"/><rect x="285" y="320" width="90" height="30" rx="3"/>
    <rect x="165" y="365" width="90" height="30" rx="3"/><rect x="285" y="365" width="90" height="30" rx="3"/>
  </g>
  <g fill="#c9a24b"><rect x="238" y="236" width="12" height="18"/><rect x="358" y="236" width="12" height="18"/><rect x="238" y="281" width="12" height="18"/><rect x="358" y="326" width="12" height="18"/><rect x="238" y="371" width="12" height="18"/></g>
  <!-- conduits -->
  <g stroke="#2f574f" stroke-width="18" fill="none" stroke-linecap="round">
    <path d="M270 480 V520 H620"/><path d="M330 480 V500 H700 V150"/>
  </g>
  <!-- lightning bolt -->
  <path d="M600 190 L560 320 L610 320 L570 440 L680 280 L625 280 L660 190 Z" fill="#c9a24b" stroke="#e4c578" stroke-width="4" stroke-linejoin="round"/>
  <!-- ground -->
  <rect x="0" y="500" width="800" height="100" fill="#24433f"/>
  <rect x="0" y="500" width="800" height="8" fill="#c9a24b" opacity="0.6"/>
</svg>
