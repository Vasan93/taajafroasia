<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="MEP pipework installation with valves and a pressure gauge">
  <defs>
    <linearGradient id="skyM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f1"/><stop offset="1" stop-color="#dbe6e1"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyM)"/>
  <!-- pipe runs -->
  <g stroke="#2f574f" stroke-width="26" fill="none" stroke-linecap="round">
    <path d="M60 210 H520 Q560 210 560 250 V430"/>
    <path d="M120 350 H420 Q460 350 460 310 V210"/>
    <path d="M600 150 V330 Q600 370 640 370 H760"/>
  </g>
  <!-- flanges -->
  <g fill="#1a322e">
    <rect x="250" y="196" width="14" height="28"/><rect x="360" y="196" width="14" height="28"/>
    <rect x="300" y="336" width="14" height="28"/><rect x="452" y="300" width="16" height="14"/>
  </g>
  <!-- valves (gold wheels) -->
  <g>
    <circle cx="180" cy="210" r="26" fill="#c9a24b"/><circle cx="180" cy="210" r="10" fill="#1a322e"/>
    <line x1="180" y1="184" x2="180" y2="236" stroke="#1a322e" stroke-width="6"/><line x1="154" y1="210" x2="206" y2="210" stroke="#1a322e" stroke-width="6"/>
    <circle cx="560" cy="410" r="24" fill="#c9a24b"/><circle cx="560" cy="410" r="9" fill="#1a322e"/>
    <line x1="560" y1="386" x2="560" y2="434" stroke="#1a322e" stroke-width="6"/><line x1="536" y1="410" x2="584" y2="410" stroke="#1a322e" stroke-width="6"/>
  </g>
  <!-- pressure gauge -->
  <g>
    <circle cx="650" cy="150" r="62" fill="#ffffff" stroke="#c9a24b" stroke-width="8"/>
    <circle cx="650" cy="150" r="7" fill="#24433f"/>
    <line x1="650" y1="150" x2="686" y2="118" stroke="#24433f" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#8fb3a8" stroke-width="4"><line x1="650" y1="98" x2="650" y2="110"/><line x1="700" y1="150" x2="688" y2="150"/><line x1="612" y1="188" x2="620" y2="180"/></g>
  </g>
  <!-- ground -->
  <rect x="0" y="500" width="800" height="100" fill="#24433f"/>
  <rect x="0" y="500" width="800" height="8" fill="#c9a24b" opacity="0.6"/>
</svg>
