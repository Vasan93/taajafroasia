<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Project delivery: building plans, hard hat and a checklist">
  <defs>
    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f1"/><stop offset="1" stop-color="#dbe6e1"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyD)"/>
  <!-- blueprint sheet -->
  <g transform="rotate(-6 300 320)">
    <rect x="90" y="150" width="420" height="330" rx="6" fill="#24433f"/>
    <g stroke="#3f6f65" stroke-width="2">
      <line x1="90" y1="200" x2="510" y2="200"/><line x1="90" y1="250" x2="510" y2="250"/><line x1="90" y1="300" x2="510" y2="300"/><line x1="90" y1="350" x2="510" y2="350"/><line x1="90" y1="400" x2="510" y2="400"/><line x1="90" y1="450" x2="510" y2="450"/>
      <line x1="150" y1="150" x2="150" y2="480"/><line x1="230" y1="150" x2="230" y2="480"/><line x1="310" y1="150" x2="310" y2="480"/><line x1="390" y1="150" x2="390" y2="480"/><line x1="450" y1="150" x2="450" y2="480"/>
    </g>
    <!-- floor plan drawing in gold -->
    <g stroke="#c9a24b" stroke-width="5" fill="none">
      <rect x="160" y="220" width="220" height="180"/>
      <line x1="160" y1="310" x2="270" y2="310"/><line x1="270" y1="220" x2="270" y2="400"/>
      <rect x="300" y="250" width="60" height="60"/>
      <line x1="380" y1="280" x2="420" y2="280"/>
    </g>
  </g>
  <!-- hard hat -->
  <g transform="translate(560 300)">
    <path d="M-70 60 a70 60 0 0 1 140 0 Z" fill="#c9a24b"/>
    <rect x="-88" y="56" width="176" height="18" rx="9" fill="#e4c578"/>
    <path d="M-14 6 a14 30 0 0 1 28 0" fill="#a9812f"/>
  </g>
  <!-- checklist -->
  <g transform="translate(560 430)">
    <rect x="0" y="0" width="180" height="120" rx="8" fill="#ffffff" stroke="#24433f" stroke-width="4"/>
    <g stroke="#c9a24b" stroke-width="6" fill="none" stroke-linecap="round"><path d="M20 30 l10 10 l18 -22"/><path d="M20 62 l10 10 l18 -22"/><path d="M20 94 l10 10 l18 -22"/></g>
    <g stroke="#8fb3a8" stroke-width="6" stroke-linecap="round"><line x1="66" y1="34" x2="150" y2="34"/><line x1="66" y1="66" x2="150" y2="66"/><line x1="66" y1="98" x2="150" y2="98"/></g>
  </g>
  <!-- ground -->
  <rect x="0" y="520" width="800" height="80" fill="#24433f"/>
  <rect x="0" y="520" width="800" height="8" fill="#c9a24b" opacity="0.6"/>
</svg>
